    api_write: true, ota_enabled: true, mdns_enabled: true,
    net_scope: 1, admin_user: "admin", admin_set: true
  };

  var SYS = {
    uptime_s: 191244, fw: "krone-master 0.16 esp32c3", mac: "a0:76:4e:2b:11:c4",
    hostname: "krone_anzeige", node_id: "krone_anzeige", mdns_enabled: true,

    { ssid: "FRITZ!Box 7590 XL", rssi: -71, enc: 1 },

  var GET = {
    "/api/status": STATUS,
    "/api/system": SYS,
    "/api/config": CFG,
    "/api/log": LOG,
    "/api/module/firmware": MODFW,
    "/api/module/update/status": { busy: false, ok: 0, failed: 0, results: [] },
    "/api/wifi/scan": WIFI,
    "/api/backup": { demo: true, cfg: CFG }
  };

  var real = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (u, o) {
    var p = String(u).split("?")[0].replace(/^https?:\/\/[^/]+/, "");
    if (p.slice(0, 5) !== "/api/") {
      return real ? real(u, o) : Promise.reject(new Error("kein fetch"));
    }
    var post = o && o.method && String(o.method).toUpperCase() !== "GET";
    var body = post ? { ok: true } : (GET[p] !== undefined ? GET[p] : {});
    return Promise.resolve({
      ok: true, status: 200,
      json: function () { return Promise.resolve(body); },
      text: function () { return Promise.resolve(JSON.stringify(body)); }
    });
  };

  function banner() {
    if (document.getElementById("demo-banner")) return;
    var d = document.createElement("div");
    d.id = "demo-banner";
    d.innerHTML =
      'Live-Demo der Master-Web-UI mit <b>Beispieldaten</b> — simulierter Bus, ' +
      '10 Module, keine echte Steuerung. Quelle: ' +
      '<a href="https://github.com/TenOfNine/SmartKroneSplitFlap" target="_blank" rel="noopener">' +
      'TenOfNine/SmartKroneSplitFlap</a>';
    var main = document.querySelector(".main") || document.body;
    main.insertBefore(d, main.firstChild);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", banner);
  } else {
    banner();
  }
})();
</script>
