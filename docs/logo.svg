<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>SmartKroneSplitFlap</title>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="84" height="84" rx="16" fill="#0b0c0e" stroke="#262a31" stroke-width="2"/>
  <rect x="15" y="15" width="70" height="70" rx="11" fill="#131519"/>
  <text x="50" y="68" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-weight="700" font-size="54" fill="#f2b03d" filter="url(#glow)">K</text>
  <rect x="15" y="48.5" width="70" height="3" fill="#0b0c0e"/>
  <rect x="15" y="48.3" width="70" height="1" fill="#000000" opacity=".55"/>
  <rect x="15" y="51.5" width="70" height="1" fill="#454b54" opacity=".7"/>
</svg>
