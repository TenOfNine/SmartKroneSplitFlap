; PlatformIO-Projekt der Zentralsteuerung.
; Ziele: docs/toolchain.md Abschnitt 4.
;
;   pio test -e native    Host-Tests der Anwendungslogik gegen einen simulierten Bus
;   pio run  -e esp32c3   Firmware kompilieren (ESP32-C3 Super Mini, hardware/master)

[env]
lib_ldf_mode = chain+
; lib/protocol wird mit der Modul-Firmware geteilt.
lib_extra_dirs = ../module/lib
build_flags = -Wall -Wextra

[env:native]
platform = native@1.2.1
build_flags = ${env.build_flags} -std=c11
test_framework = unity

; Zielhardware: hardware/master (ESP32-C3 Super Mini, steckbar).
; Pin-/UART-Belegung und hardwarenahe Konstanten: src/board.h (#43).
[env:esp32c3]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; bytegleich reproduzierbar, siehe scripts/reproducible.py (#43)
extra_scripts = pre:scripts/reproducible.py
build_flags = ${env.build_flags} -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; exakt gepinnt (#43), wie zuletzt aufgeloest
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8
    https://github.com/tzapu/WiFiManager.git#v2.0.17
