; PlatformIO-Projekt der Modulsteuerung (ATtiny1616).
; Ziele und Kommandos: docs/toolchain.md Abschnitt 4.
;
;   pio test -e native      Protokoll- und Enumerationstests auf dem Host (T6)
;   pio run  -e attiny1616  Firmware kompilieren (ab T7)

[env]
lib_ldf_mode = chain+
build_flags = -Wall -Wextra

[env:native]
platform = native
build_flags = ${env.build_flags} -std=c11
test_framework = unity

[env:attiny1616]
platform = atmelmegaavr
board = ATtiny1616
; Bare metal (avr-libc), kein Arduino-Framework: knapper Flash-Bedarf und volle
; Kontrolle ueber USART0-RS485, TCB0-Zeitbasis und Watchdog. Siehe
; docs/toolchain.md Abschnitt 4.
board_build.f_cpu = 20000000L
build_flags = ${env.build_flags} -std=c11 -Os -flto
upload_protocol = serialupdi

; Wie attiny1616, aber fuer den Betrieb HINTER dem residenten Bootloader
; (firmware/bootloader): App ab 0x0C00, Bootloader-Kennung in CMD_GET_VERSION.
; Erzeugt das Image fuer den Werksflash (updi.js) und den signierten .kota-Container
; (Firmware-Verteilung ueber den Bus, experimentell -- siehe docs/module-bootloader.md).
[env:attiny1616_boot]
extends = env:attiny1616
build_flags = ${env.build_flags} -std=c11 -Os -flto -DHAS_BOOTLOADER
    -Wl,--section-start=.text=0x0C00
