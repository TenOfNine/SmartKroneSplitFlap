; Residenter Bootloader der Modulsteuerung (ATtiny1616).
;
;   pio run -e bootloader -d firmware/bootloader
;
; Liegt im per Fuse BOOTEND abgetrennten Boot-Bereich (3 KiB, BOOTEND = 0x0C).
; Nach jedem Reset laeuft er zuerst: prueft den "im Bootloader bleiben"-Marker
; (GPR0 == 0xB7, von CMD_ENTER_BOOTLOADER gesetzt) bzw. ob eine gueltige App da
; ist, empfaengt sonst die Firmware ueber USART0/RS-485 (dieselbe Rahmenschicht
; wie die App) und schreibt sie ab 0x0C00 in den App-Bereich.
;
; EXPERIMENTELL -- am Geraet noch nicht verifiziert. Erstflash + Fuse weiterhin
; per UPDI/J6. Siehe docs/module-bootloader.md.

[env:bootloader]
platform = atmelmegaavr
board = ATtiny1616
board_build.f_cpu = 20000000L
lib_extra_dirs = ../module/lib
build_flags =
    -std=c11 -Os -flto -Wall -Wextra
    -DBOOT_APP_BASE=0x0C00
    -ffunction-sections -fdata-sections
    -Wl,--gc-sections
    -Wl,--section-start=.text=0x0
