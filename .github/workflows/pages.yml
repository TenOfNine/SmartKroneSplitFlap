name: Pages – ESP Web Flasher

# Veroeffentlicht den Web-Flasher als GitHub Page:
#   https://tenofnine.github.io/SmartKroneSplitFlap/
# Der Publish-Ordner wird aus beiden prebuilt/-Verzeichnissen zusammengestellt:
#   Master : index.html, updi.js, manifest.json, krone-master-esp32c3.factory.bin
#   Modul  : krone-daughtercard-attiny1616.hex
# Die .kota bleibt aussen vor -- die laeuft ueber die Geraete-Web-UI, nicht ueber
# diese Seite.
#
# Einmalig im Repo aktivieren: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'firmware/master/prebuilt/**'
      - 'firmware/module/prebuilt/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish-Verzeichnis zusammenstellen
        run: |
          sha=$(git rev-parse --short HEAD)
          d=$(git log -1 --format=%cd --date=short)
          mkdir _site
          cp firmware/master/prebuilt/index.html \
             firmware/master/prebuilt/updi.js \
             firmware/master/prebuilt/manifest.json \
             firmware/master/prebuilt/krone-master-esp32c3.factory.bin \
             _site/
          cp firmware/module/prebuilt/krone-daughtercard-attiny1616.hex _site/
          jq --arg v "$d ($sha)" '.version = $v' _site/manifest.json > _site/manifest.tmp \
            && mv _site/manifest.tmp _site/manifest.json
          echo "manifest version -> $d ($sha)"
          ls -l _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
