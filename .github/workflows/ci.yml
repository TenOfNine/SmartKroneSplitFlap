name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # fuer den Release-Job
  actions: write    # Release-Job stoesst den Pages-Workflow an

jobs:
  host-tests:
    name: Host-Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/**/platformio.ini') }}
          restore-keys: pio-native-
      - run: pip install platformio==6.1.19   # gepinnt wie lokal (#43)
      - name: Modul-Bibliotheken (pio test -e native)
        run: pio test -e native -d firmware/module
      - name: Master-Bibliotheken (pio test -e native)
        run: pio test -e native -d firmware/master
      - name: busctl
        run: python tools/test_busctl.py
      - name: Web-UI (Syntax + jsdom-Smoke)
        run: |
          python tools/build_webui_demo.py
          npm install --no-save --no-audit --no-fund jsdom@24
          node tools/check_webui.mjs

  firmware:
    name: Firmware-Builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-build-${{ hashFiles('firmware/**/platformio.ini') }}
          restore-keys: pio-build-
      - run: pip install platformio==6.1.19   # gepinnt wie lokal (#43)
      - name: Modul-Firmware (ATtiny1616)
        run: pio run -e attiny1616 -d firmware/module
      - name: Flash-Verbrauch < 8 KB
        run: python tools/check_flash.py firmware/module/.pio/build/attiny1616/firmware.elf 8192
      - name: Modul-Firmware hinter Bootloader (attiny1616_boot)
        run: pio run -e attiny1616_boot -d firmware/module
      - name: Modul-Bootloader (< 3 KiB Boot-Sektion)
        run: |
          pio run -e bootloader -d firmware/bootloader
          python tools/check_flash.py firmware/bootloader/.pio/build/bootloader/firmware.elf 3072
      - name: Modul-Prebuilts passen zur Quelle (#43)
        run: |
          # Modul-Builds sind deterministisch; ein vergessener Neubau der
          # Prebuilts (Auslieferung ueber main) faellt hier auf.
          diff <(tr -d '\r' < firmware/module/.pio/build/attiny1616/firmware.hex) firmware/module/prebuilt/krone-daughtercard-attiny1616.hex
          diff <(tr -d '\r' < firmware/module/.pio/build/attiny1616_boot/firmware.hex) firmware/module/prebuilt/krone-daughtercard-attiny1616-boot.hex
          diff <(tr -d '\r' < firmware/bootloader/.pio/build/bootloader/firmware.hex) firmware/module/prebuilt/krone-daughtercard-bootloader.hex
        shell: bash
      - name: Master-Firmware (ESP32-C3)
        run: pio run -e esp32c3 -d firmware/master
      - name: Prebuilt-Container gegen den einkompilierten Public Key pruefen
        run: |
          pip install cryptography
          python tools/ota_keys.py verify firmware/master/prebuilt/krone-master-esp32c3.kota
          python tools/ota_keys.py verify firmware/module/prebuilt/krone-daughtercard-attiny1616.mota

  hardware:
    name: Schaltplan-ERC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KiCad 9 + Bibliotheken + xvfb
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          # kicad-symbols/-footprints/-templates sind bei KiCad 9 nur ein
          # Recommends -> explizit installieren, aber ohne die 3D-Modelle.
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-symbols kicad-footprints kicad-templates xvfb
      - run: pip install kicad-sch-api kicad-skip
      - name: Bibliothekstabellen
        run: bash tools/setup.sh --kicad-config
      - name: Netzliste konsistent (versionsunabhaengig)
        run: |
          python tools/gen_daughtercard_sch.py --check-only
          python tools/gen_master_sch.py --check-only
      - name: ERC Daughter Card
        run: >
          xvfb-run -a kicad-cli sch erc --exit-code-violations
          --severity-error --severity-warning
          -o erc-daughtercard.rpt
          hardware/daughtercard/daughtercard.kicad_sch
      - name: ERC Master
        run: >
          xvfb-run -a kicad-cli sch erc --exit-code-violations
          --severity-error --severity-warning
          -o erc-master.rpt
          hardware/master/master.kicad_sch
      - if: failure()
        run: cat erc-daughtercard.rpt erc-master.rpt || true
      # Informativ: haengt von der genauen KiCad-Symbolbibliothek ab; ein
      # Patch-Release kann eine Neuerzeugung der krone*.kicad_sym noetig machen.
      - name: Symbolbibliotheken aktuell (informativ)
        continue-on-error: true
        run: |
          python tools/build_krone_symbols.py --check
          python tools/build_krone_master_symbols.py --check

  release:
    name: Release-Artefakte
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware, hardware]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KiCad 9 + Bibliotheken + xvfb
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-symbols kicad-footprints kicad-templates xvfb
      - run: bash tools/setup.sh --kicad-config
      - name: Schaltplan-PDF
        run: >
          xvfb-run -a kicad-cli sch export pdf
          -o daughtercard.pdf hardware/daughtercard/daughtercard.kicad_sch
      - name: Gerber (sobald geroutet)
        run: |
          PCB=hardware/daughtercard/daughtercard.kicad_pcb
          if [ -f "$PCB" ]; then
            xvfb-run -a kicad-cli pcb export gerbers -o gerber/ "$PCB"
            xvfb-run -a kicad-cli pcb export drill   -o gerber/ "$PCB"
            (cd gerber && zip -r ../daughtercard-gerber.zip .)
          else
            echo "kein .kicad_pcb -- Gerber-Export uebersprungen"
          fi
      - name: Release-Notizen aus firmware/CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "## Firmware $v"
            echo
            grep -E "^\| ${v//./\\.} \|" firmware/CHANGELOG.md | awk -F'|' '{print $4}' | sed 's/^ *//'
            echo
            echo "**Flashen:** Webflasher https://tenofnine.github.io/SmartKroneSplitFlap/ (Version oben auswählen)."
            echo "Master-Update über die Web-UI: \`krone-master-esp32c3.kota\`; Module über den Bus (im Master eingebettet) oder per Werksflash."
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            firmware/master/prebuilt/krone-master-esp32c3.factory.bin
            firmware/master/prebuilt/krone-master-esp32c3.kota
            firmware/master/prebuilt/manifest.json
            firmware/module/prebuilt/krone-daughtercard-attiny1616.hex
            firmware/module/prebuilt/krone-daughtercard-attiny1616-boot.hex
            firmware/module/prebuilt/krone-daughtercard-bootloader.hex
            firmware/module/prebuilt/krone-daughtercard-attiny1616.mota
            firmware/CHANGELOG.md
            daughtercard.pdf
            daughtercard-gerber.zip
          fail_on_unmatched_files: false
      - name: Webflasher neu veroeffentlichen (Versionsauswahl)
        # Mit GITHUB_TOKEN erzeugte Releases loesen keine anderen Workflows aus;
        # workflow_dispatch ist die dokumentierte Ausnahme.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
